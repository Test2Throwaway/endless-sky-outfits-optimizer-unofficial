[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "es-optimizer"
version = "0.1.0"
description = "Unofficial ship loadout optimizer for Endless Sky"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
dependencies = ["ortools>=9.10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
es-optimizer = "es_optimizer.cli:main"

[tool.setuptools]
packages = ["es_optimizer"]

[tool.setuptools.package-data]
es_optimizer = ["roles/*.toml"]
