name = "In-combat scavenger"
description = """
Not a combat ship, but present at space battles and has to survive them. Other ships do all the damage
needed, so its own damage gets almost no weight. Picks up what falls out of destroyed ships."""

[ship]
combat = false

[should]                          # baseline: what to optimize
survivability = 3                 # shield generation, hull repair, anti-missile, ...
maneuverability = 2               # reverse thrust, high thrust and turn

[must]
has = ["tractor beam"]            # hard requirement
reverse_thrust = "balanced"       # hard requirement
emphasize = ["cargo space"]       # "very high cargo space": weighted well above the baseline

[may]
bonus = ["push force"]            # weapons that push enemies away: some real weight, never top priority
