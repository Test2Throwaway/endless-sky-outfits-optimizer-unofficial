name = "Peaceful-area freighter"
description = """
Hauls cargo in safe space. Should almost never see hostile ships, and only when escorted."""

[ship]
combat = false

[should]
"cargo space" = 1
deprioritize = ["maneuverability"]

[must]
min = { "cargo space" = 1000, "jumps" = 6 }

[must_not]
have = ["jump drive", "anti-missile"]   # both would otherwise be required by default
