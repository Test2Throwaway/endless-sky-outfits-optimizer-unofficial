name = "Dedicated warship"
description = "Fights other warships for the length of a full engagement (about 4 minutes)."

[ship]
combat = true
weapons_budget = [0.85, 1.0]     # a dedicated combat ship never gives up more than 15% of its weapons
fight = "dedicated"

[should]
firepower = 3
survivability = 2
maneuverability = 1

[must]
# Even a tank must keep up: no slower than the slowest 1 in 20 stock ships, in turning and acceleration.
min_percentile = { "turn rate" = 0.05, acceleration = 0.05 }
