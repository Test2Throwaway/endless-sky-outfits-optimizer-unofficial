# Composite metrics: a name for a weighted mix of metrics, usable in any role's [should] section.
# Weights inside a composite are relative; the optimizer scores each metric against the best this hull can reach,
# so units don't need to match. Provisional: tune these as results come in.

[metrics.survivability]            # regeneration-based: max shields and hull come from the hull alone
"shield regen" = 2                 # effective: includes shield protection
"hull repair" = 1                  # effective: includes hull protection
"anti-missile" = 1

[metrics.maneuverability]          # turn and delta-v; reverse thrust has its own [must] level
"turn rate" = 1
"acceleration" = 1

[metrics.speed]
"max speed" = 2
"acceleration" = 1

[metrics.firepower]
"weapon value" = 1
