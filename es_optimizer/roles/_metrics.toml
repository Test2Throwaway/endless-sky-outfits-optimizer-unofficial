# Composite metrics: a name for a weighted mix of metrics, usable in any role's [should] section.
# Weights inside a composite are relative; the optimizer scores each metric against the stock ships of
# the game (see docs/design-notes.md), so units don't need to match. Provisional: tune these as results come in.

# Survivability (user): damage the ship can absorb, sustained and in a burst (see calculator.sustained_absorb and
# burst_absorb); "absorb" is their geometric mean, so a design needs both a pool and a way to refill it. Evasion is
# not part of it: roles weigh agility, maneuverability or speed for that.
[metrics.survivability]
"absorb" = 3
"anti-missile" = 1

# combine = "product": the parts' scores are multiplied (a weighted geometric mean, the weights are exponents),
# so a design must be good at all of them; a sum lets one part make up for another.
[metrics.maneuverability]          # turn and delta-v; reverse thrust has its own [must] level
combine = "product"
"turn rate" = 1                    # 1 to 1 for now; change these to favour one side
"acceleration" = 1

[metrics.speed]
"max speed" = 2
"acceleration" = 1

[metrics.firepower]
"weapon value" = 1
